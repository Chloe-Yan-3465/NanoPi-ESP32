[platformio]
default_envs = wearable_head_timesync
src_dir = .

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp32_mode2_sync_timesync.cpp>
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

[env:coordinator_timesync]
build_flags =
    ${env.build_flags}
    -D MODE2_ROLE_COORDINATOR=1

# Bench test: one coordinator + wearable_head + one NanoPi/camera node.
[env:coordinator_single_timesync]
build_flags =
    ${env.build_flags}
    -D MODE2_ROLE_COORDINATOR=1
    -D MODE2_NODE_COUNT=1

[env:wearable_head_timesync]
build_flags =
    ${env.build_flags}
    -D MODE2_ROLE_WEARABLE=1
    -D MODE2_NODE_ID=1

[env:wearable_left_timesync]
build_flags =
    ${env.build_flags}
    -D MODE2_ROLE_WEARABLE=1
    -D MODE2_NODE_ID=2

[env:wearable_right_timesync]
build_flags =
    ${env.build_flags}
    -D MODE2_ROLE_WEARABLE=1
    -D MODE2_NODE_ID=3
